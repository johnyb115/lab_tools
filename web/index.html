<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Tools</title>
  <meta name="description" content="Browser-based research utilities for electrochemistry, data analysis and figures. Files never leave your machine." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/style.css" />
  <script>(function(){var t;try{t=localStorage.getItem("lab-tools-theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme:light)").matches?"light":"dark";document.documentElement.dataset.theme=t})()</script>
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="site-main">
    <section class="home-intro">
      <div>
        <h1>Research utilities that run in your browser. <span>Files never leave your machine.</span></h1>
        <p class="home-intro__meta">
          <span><b id="tool-total">24</b> tools</span>
          <span><b>5</b> categories</span>
          <span><b>0</b> uploads</span>
          <span>open source</span>
        </p>
      </div>
      <div class="finder" role="search">
        <label class="finder__field">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="6.5" cy="6.5" r="5" /><path d="m10 10 4.5 4.5" /></svg>
          <span class="sr-only">Search tools</span>
          <input id="tool-search" type="search" placeholder="Search by tool, method or file type…" autocomplete="off" spellcheck="false" />
          <kbd>/</kbd>
        </label>
        <div class="cat-filter" id="cat-filter" aria-label="Filter by category"></div>
      </div>
    </section>

    <div class="reticle" id="reticle">
      <i class="reticle__cross reticle__cross--tl" aria-hidden="true"></i>
      <i class="reticle__cross reticle__cross--tr" aria-hidden="true"></i>
      <i class="reticle__cross reticle__cross--bl" aria-hidden="true"></i>
      <i class="reticle__cross reticle__cross--br" aria-hidden="true"></i>
      <div id="tool-index"></div>
      <div class="reticle__empty" id="tool-empty" hidden>
        <p>No tool matches “<span id="tool-empty-q"></span>”. Try a file type like “xlsx” or a method like “fit”.</p>
        <button class="btn" type="button" id="tool-reset">Show all tools</button>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script type="module" src="/src/tools/home.js"></script>
</body>
</html>
